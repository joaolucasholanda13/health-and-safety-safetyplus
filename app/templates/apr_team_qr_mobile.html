<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Identificar integrante · Safety Plus</title><style>body{font-family:Arial,sans-serif;background:#f3f0ed;margin:0;color:#171717}.box{max-width:480px;margin:32px auto;background:#fff;border-radius:22px;padding:24px;box-shadow:0 10px 30px #0001}h1{font-size:24px;margin:0 0 8px}.sub{color:#666;margin:0 0 22px}label{font-weight:700;display:block;margin-bottom:8px}input{box-sizing:border-box;width:100%;font-size:20px;padding:15px;border:1px solid #bbb;border-radius:14px}button{width:100%;margin-top:14px;padding:15px;border:0;border-radius:14px;background:#171717;color:#fff;font-size:17px;font-weight:700}.ok{padding:18px;border-radius:14px;background:#effaf3;color:#176b38;font-weight:700}.err{color:#d92d20;margin:10px 0}</style></head><body><div class="box"><h1>Identificar integrante</h1><p class="sub">Safety Plus · APR</p>{% if done %}<div class="ok">✓ Dados enviados para a APR.<br><br>Você já pode fechar esta tela.</div>{% else %}<form method="post"><label>Seu CPF</label><input name="cpf" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" required autofocus>{% if error %}<div class="err">{{ error }}</div>{% endif %}<button type="submit">Enviar meus dados</button></form>{% endif %}</div></body></html>
